<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>CareRescue 行動登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mobile-login.css">
</head>
<body>
  <main class="mobile-login">
    <section class="mobile-login-brand">
      <div class="mobile-logo"><b>C</b><i>＋</i></div>
      <h1>CareRescue</h1>
      <p>照常營業</p>
      <small>照服員行動服務</small>
    </section>
    <section class="mobile-login-form">
      <div class="login-heading"><small>WELCOME BACK</small><h2>登入行動服務</h2><p>查看班表或提出請假申請</p></div>
      <form id="mobile-login-form">
        <label>員工帳號<input id="mobile-account" value="caregiver.demo" autocomplete="username"></label>
        <label>密碼<div class="mobile-password"><input id="mobile-password" type="password" value="demo2026" autocomplete="current-password"><button type="button" id="mobile-toggle">顯示</button></div></label>
        <label class="remember"><input type="checkbox" checked><span>記住展示帳號</span></label>
        <button class="mobile-login-submit" type="submit">登入</button>
        <p id="mobile-login-error"></p>
      </form>
      <div class="mobile-demo"><strong>展示帳號</strong><span>caregiver.demo</span><span>demo2026</span></div>
    </section>
    <footer>CareRescue｜居服異動與量能救援台</footer>
  </main>
  <script src="mobile-login.js"></script>
</body>
</html>
